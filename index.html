<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#241b34">
  <meta name="description" content="一個可離線遊玩的單人派對選擇遊戲。">
  <title>午夜選擇題｜單機版</title>
  <link rel="stylesheet" href="./styles.css?v=solo2">
  <script defer src="./data.js?v=solo1"></script><script defer src="./app.js?v=solo1"></script>
</head>
<body>
  <main class="app-shell">
    <header class="brand"><span class="brand-mark">✦</span><span>午夜選擇題</span><small>SOLO EDITION</small></header>
    <section id="start-screen" class="screen start-screen">
      <p class="eyebrow">一個人的派對，也能很好玩</p><h1>今晚，照自己的<br><em>節奏玩。</em></h1>
      <p class="lead">10 個夜晚、10 次選擇。認識新朋友、讀懂氣氛、守住界線，看看你會帶著什麼故事回家。</p>
      <div class="how-to"><span>🎲 每局隨機角色與情境</span><span>🫶 選擇永遠由你決定</span><span>📱 無網路也能玩</span></div>
      <button id="start-btn" class="button primary">開始今晚</button><button id="continue-btn" class="button text hidden">繼續上一局</button>
      <p class="note">這是虛構的成人派對情境遊戲；現實中的互動，永遠以明確同意與安全為先。</p>
    </section>
    <section id="game-screen" class="screen hidden">
      <div class="topbar"><button id="quit-btn" class="icon-btn" aria-label="離開遊戲">×</button><div class="round"><span id="round-label">夜晚 1</span><div class="dots" id="round-dots"></div></div><button id="sound-btn" class="icon-btn" aria-label="切換音效">♪</button></div>
      <div class="meters" aria-label="目前狀態"><div><span>自在</span><strong id="comfort-value">50</strong><i><b id="comfort-bar"></b></i></div><div><span>直覺</span><strong id="instinct-value">50</strong><i><b id="instinct-bar"></b></i></div><div><span>回憶</span><strong id="memory-value">0</strong><i><b id="memory-bar"></b></i></div></div>
      <article class="scene-card"><div id="scene-orb" class="scene-orb">🌙</div><p id="scene-kicker" class="eyebrow">今晚的相遇</p><h2 id="scene-title">正在挑選今晚的故事</h2><p id="scene-copy"></p><div class="person-card"><span id="person-avatar">🪩</span><div><strong id="person-name"></strong><small id="person-trait"></small></div></div></article>
      <p class="choice-label">你想怎麼做？</p><div id="choices" class="choices"></div>
    </section>
    <section id="result-screen" class="screen hidden"><p class="eyebrow">今晚的結尾</p><div id="ending-icon" class="ending-icon">✦</div><h1 id="ending-title">你帶著好心情回家</h1><p id="ending-copy" class="lead"></p><div class="final-stats"><div><strong id="final-comfort">0</strong><span>自在</span></div><div><strong id="final-instinct">0</strong><span>直覺</span></div><div><strong id="final-memory">0</strong><span>回憶</span></div></div><div id="story-log" class="story-log"></div><button id="restart-btn" class="button primary">再玩一晚</button><button id="home-btn" class="button text">回首頁</button></section>
  </main><div id="toast" class="toast hidden"></div>
</body></html>
