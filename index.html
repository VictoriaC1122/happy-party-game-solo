<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f5edef">
  <meta name="description" content="健康社交模擬遊戲單機版：看線索、做選擇，直到最後翻牌。">
  <meta name="robots" content="index,follow">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'">
  <link rel="canonical" href="https://victoriac1122.github.io/happy-party-game-solo/">
  <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml">
  <meta property="og:type" content="website">
  <meta property="og:locale" content="zh_TW">
  <meta property="og:title" content="健康社交模擬遊戲｜單機版">
  <meta property="og:description" content="看線索、做選擇，直到最後翻牌。">
  <meta property="og:url" content="https://victoriac1122.github.io/happy-party-game-solo/">
  <meta property="og:image" content="https://victoriac1122.github.io/happy-party-game-solo/assets/optimized/endings/victory-dawn-v2-1200.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="675">
  <meta property="og:image:type" content="image/jpeg">
  <meta property="og:image:alt" content="夜店散場後迎向日出的動漫勝利插圖">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="健康社交模擬遊戲｜單機版">
  <meta name="twitter:description" content="看線索、做選擇，直到最後翻牌。">
  <meta name="twitter:image" content="https://victoriac1122.github.io/happy-party-game-solo/assets/optimized/endings/victory-dawn-v2-1200.jpg">
  <meta name="twitter:image:alt" content="夜店散場後迎向日出的動漫勝利插圖">
  <title>健康社交模擬遊戲｜單機版</title>
  <link rel="stylesheet" href="./styles.css?v=clean2">
  <script defer src="./data.js?v=clean2"></script>
  <script defer src="./engine.js?v=clean2"></script>
  <script defer src="./app.js?v=clean2"></script>
</head>
<body>
  <div class="backdrop" aria-hidden="true"></div>
  <noscript><p class="noscript-notice">需要啟用 JavaScript 才能開始。</p></noscript>

  <main class="app-shell" id="main-content">
    <header class="hero-card">
      <div>
        <p class="eyebrow">夜還沒散</p>
        <h1>健康社交模擬遊戲 <span>單機版</span></h1>
        <p>看標籤、決定要不要刺探，再選這一晚怎麼走。</p>
      </div>
      <div class="hero-mark" aria-hidden="true">💘</div>
    </header>

    <section id="intro-screen" class="panel screen" aria-labelledby="intro-title">
      <div class="panel-head">
        <div>
          <p class="eyebrow">進場</p>
          <h2 id="intro-title">今晚想遇見誰？</h2>
        </div>
      </div>

      <div id="load-error" class="load-error hidden" role="alert">遊戲元件沒有完整載入，請重新整理。</div>

      <div class="setup-grid">
        <label>
          <span>你的性別</span>
          <select id="player-gender">
            <option value="female">女</option>
            <option value="male">男</option>
          </select>
        </label>
        <label>
          <span>想遇見的性別</span>
          <select id="partner-gender">
            <option value="male">男</option>
            <option value="female">女</option>
          </select>
        </label>
      </div>

      <div class="rule-strip" aria-label="遊戲規則">
        <span><b>壓抑 0</b> 才結算</span>
        <span><b>壓力 80</b> 線索模糊</span>
        <span><b>試紙看對方</b> · 醫院看自己</span>
      </div>

      <p id="resume-note" class="resume-note hidden" role="status"></p>
      <div class="button-row">
        <button id="start-btn" class="primary-btn" type="button">開始</button>
        <button id="new-game-btn" class="ghost-btn hidden" type="button">開新局</button>
      </div>
    </section>

    <section id="round-screen" class="panel screen hidden" aria-labelledby="round-title">
      <div class="panel-head">
        <div>
          <p class="eyebrow">目前進度</p>
          <h2 id="round-title">第 1 晚</h2>
        </div>
        <span class="phase-pill">還沒翻牌</span>
      </div>

      <div class="stat-grid" aria-label="本局狀態">
        <article>
          <div><span>壓抑值</span><strong id="heat-value">50%</strong></div>
          <progress class="meter" id="heat-meter" aria-label="壓抑值" max="100" value="50">50%</progress>
        </article>
        <article>
          <div><span>心理壓力</span><strong id="anxiety-value">0%</strong></div>
          <progress class="meter" id="anxiety-meter" aria-label="心理壓力" max="100" value="0">0%</progress>
        </article>
      </div>

      <div id="panic-note" class="panic-note hidden" role="status">雜訊開始蓋住部分標籤。</div>

      <div class="tool-row" aria-label="本局工具">
        <button id="test-btn" class="tool-btn" type="button"><span>🧪 對方試紙</span><small id="test-count">x1</small></button>
        <button id="hospital-btn" class="tool-btn" type="button"><span>🏥 去醫院</span><small>壓抑 +10 · 壓力歸零</small></button>
      </div>

      <article class="partner-card" aria-labelledby="partner-name">
        <div class="partner-head">
          <div id="partner-avatar" class="partner-avatar" aria-hidden="true"></div>
          <div>
            <p class="eyebrow">今晚對象</p>
            <h3 id="partner-name">抽人中</h3>
            <p id="partner-flirt" class="partner-flirt"></p>
          </div>
        </div>
        <div id="partner-tags" class="tag-cloud" aria-label="對方標籤"></div>
        <p id="probe-result" class="probe-result" aria-live="polite">還有一個標籤沒翻開。</p>
        <button id="probe-btn" class="probe-btn" type="button">💬 刺探 · 壓抑 +3</button>
      </article>

      <h3 id="action-title" class="action-title">這一晚怎麼走？</h3>
      <div id="action-buttons" class="action-grid" role="group" aria-labelledby="action-title"></div>
    </section>

    <section id="awards-screen" class="panel screen hidden" aria-labelledby="awards-title">
      <div class="panel-head">
        <div>
          <p class="eyebrow">最後翻牌</p>
          <h2 id="awards-title">本局復盤</h2>
        </div>
        <span id="finale-status" class="phase-pill"></span>
      </div>
      <img id="finale-image" class="finale-art" alt="" width="1200" height="675" decoding="async">
      <article class="finale-copy">
        <h3 id="finale-heading"></h3>
        <p id="finale-body"></p>
      </article>
      <div id="replay-overview" class="replay-overview"></div>
      <div id="replay-list" class="replay-list" aria-label="每晚復盤"></div>
      <button id="restart-btn" class="primary-btn" type="button">再來一局</button>
    </section>
  </main>

  <section id="feedback-overlay" class="feedback-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="feedback-title">
    <article class="feedback-card">
      <span class="feedback-kicker">第 <b id="feedback-turn">1</b> 晚</span>
      <h2 id="feedback-title"></h2>
      <p id="feedback-body"></p>
      <p id="feedback-delta" class="feedback-delta"></p>
      <button id="continue-btn" class="primary-btn" type="button">繼續</button>
    </article>
  </section>

  <div id="toast" class="toast hidden" role="status" aria-live="polite"></div>
</body>
</html>
